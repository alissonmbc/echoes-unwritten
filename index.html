  #fade{position:fixed;inset:0;background:#1b1511;opacity:1;transition:opacity 1.2s;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:22px;letter-spacing:.08em}

  #menu.title,#menu.pause{display:flex}
  #menu.title{align-items:flex-start;padding:0 clamp(24px,8vw,120px);background:linear-gradient(90deg,rgba(14,13,24,.82),rgba(14,13,24,.45) 42%,rgba(14,13,24,0) 70%)}

  #menu p{margin:0 0 18px;font-size:clamp(18px,2vw,24px);letter-spacing:.3em;text-transform:uppercase;color:#e6c46e}
  #menu.pause h2{margin-bottom:18px}
  #menu button{width:min(320px,80vw);display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px;font-size:20px;text-align:left;background:rgba(18,16,30,.72)}
  #menu button small{font-size:14px;opacity:.85}

  @media (max-width:640px){#hint{font-size:13px}#title h1{font-size:18px}}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createShell } from './src/app/shell.js';
import { RoadCorridor } from './src/world/corridor.js';
import { CollisionWorld } from './src/world/collision.js';
import { PlayerMotor } from './src/world/motor.js';

const V3 = THREE.Vector3, MU = THREE.MathUtils, UP = new V3(0,1,0);

/* ---------- seeded random + Perlin noise ---------- */
let seed = 20261106;
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a,b) => a + (b-a)*rnd();
const PERM = new Uint8Array(512);
{ const p = [...Array(256).keys()]; for (let i=255;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [p[i],p[j]]=[p[j],p[i]]; } for (let i=0;i<512;i++) PERM[i]=p[i&255]; }
const fade = t => t*t*t*(t*(t*6-15)+10), lerp = (a,b,t) => a+(b-a)*t;
function grad(h,x,y,z){ h&=15; const u=h<8?x:y, v=h<4?y:(h===12||h===14?x:z); return ((h&1)?-u:u)+((h&2)?-v:v); }
function noise3(x,y,z){
  const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
  x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
  const u=fade(x), v=fade(y), w=fade(z);
  const A=PERM[X]+Y, AA=PERM[A]+Z, AB=PERM[A+1]+Z, B=PERM[X+1]+Y, BA=PERM[B]+Z, BB=PERM[B+1]+Z;
  return lerp(lerp(lerp(grad(PERM[AA],x,y,z),grad(PERM[BA],x-1,y,z),u),lerp(grad(PERM[AB],x,y-1,z),grad(PERM[BB],x-1,y-1,z),u),v),
              lerp(lerp(grad(PERM[AA+1],x,y,z-1),grad(PERM[BA+1],x-1,y,z-1),u),lerp(grad(PERM[AB+1],x,y-1,z-1),grad(PERM[BB+1],x-1,y-1,z-1),u),v),w);
}
function fbm(x,y,z,o=4){ let a=.5,f=1,s=0; for(let i=0;i<o;i++){ s+=a*noise3(x*f,y*f,z*f); f*=2.03; a*=.5; } return s; }

const GLSL_NOISE = `
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm2(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vnoise(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
`;

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_DEN = 0.00072;
scene.fog = new THREE.FogExp2(0xe9cdb3, FOG_DEN);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 4000);
const SUN = new V3(-0.85, 0.24, -0.5).normalize();
const clockU = { value: 0 };

/* ---------- sky ---------- */
const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: SUN }, uTime: clockU },
  vertexShader: `varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: GLSL_NOISE + `
  uniform vec3 uSun; uniform float uTime; varying vec3 vDir;
  void main(){
    vec3 d=normalize(vDir); float h=d.y;
    vec3 zen=vec3(.2,.36,.7), mid=vec3(.55,.66,.86), hor=vec3(.98,.82,.68), low=vec3(.82,.64,.54);
    vec3 c=mix(hor,mid,smoothstep(.0,.12,h)); c=mix(c,zen,smoothstep(.1,.5,h)); c=mix(c,low,smoothstep(0.,-.25,h));
    float s=max(dot(d,uSun),0.);
    c+=vec3(1.,.62,.32)*pow(s,6.)*.3+vec3(1.,.85,.6)*pow(s,60.)*.8+vec3(1.,.95,.85)*smoothstep(.9993,.9997,s)*4.;
    vec2 cp=d.xz/(max(h,.02)+.3)*.55+vec2(uTime*.004,uTime*.0015);
    float cl=fbm2(cp*1.1)*.75+fbm2(cp*2.7+3.)*.25; cl=smoothstep(.44,.8,cl)*smoothstep(.02,.12,h)*(1.-smoothstep(.5,.9,h));
    vec3 cc=mix(vec3(1.,.8,.66),vec3(1.,.92,.78),pow(s,3.)); cc=mix(cc,vec3(.86,.78,.84),smoothstep(.25,.7,h)*.5);
    c=mix(c,cc,cl*.78);
    gl_FragColor=vec4(pow(c,vec3(2.2)),1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`
}));
sky.renderOrder = -1;
scene.add(sky);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x6b5040, 1.15));
const sun = new THREE.DirectionalLight(0xffcd98, 3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-40, right:40, top:40, bottom:-40, near:1, far:320 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

/* ---------- canvas textures ---------- */
function canvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d')]; }
function tex(c, rep=[1,1]){ const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy=8; return t; }
const grey = (v) => `rgb(${v|0},${(v*.96)|0},${(v*.9)|0})`;

function cobbleCanvas(){
  const S=1024, [c,x]=canvas(S,S);
  x.fillStyle='#3a342d'; x.fillRect(0,0,S,S);
  const rows=14, cols=9;
  for(let r=0;r<rows;r++) for(let k=0;k<cols;k++){
    const cx=(k+.5+(r%2?.5:0)+rr(-.15,.15))*S/cols, cy=(r+.5+rr(-.12,.12))*S/rows;
    const rx=S/cols*rr(.36,.47), ry=S/rows*rr(.36,.46), v=rr(105,170);
    for(const oy of [-S,0,S]){
      if(cy+oy<-80||cy+oy>S+80) continue;
      x.beginPath();
      const n=8, pts=[];
      for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, j=rr(.82,1.05); pts.push([cx+Math.cos(a)*rx*j, cy+oy+Math.sin(a)*ry*j]); }
      for(let i=0;i<n;i++){ const p=pts[i], q=pts[(i+1)%n], m=[(p[0]+q[0])/2,(p[1]+q[1])/2]; i===0?x.moveTo(m[0],m[1]):0; x.quadraticCurveTo(q[0],q[1],(q[0]+pts[(i+2)%n][0])/2,(q[1]+pts[(i+2)%n][1])/2); }
      const g=x.createRadialGradient(cx-rx*.3,cy+oy-ry*.3,2,cx,cy+oy,Math.max(rx,ry)*1.1);
      g.addColorStop(0,grey(v+25)); g.addColorStop(.7,grey(v)); g.addColorStop(1,grey(v*.55));
      x.fillStyle=g; x.fill();
    }
  }
  for(let i=0;i<9000;i++){ x.fillStyle=`rgba(${rnd()<.5?0:255},${rnd()<.5?0:240},${rnd()<.5?0:220},${rr(.02,.08)})`; x.fillRect(rnd()*S,rnd()*S,2,2); }
  return c;
}
function ashlarCanvas(){
  const S=512, [c,x]=canvas(S,S);
  x.fillStyle='#6e6455'; x.fillRect(0,0,S,S);
  const rh=64;
  for(let y=0;y<S;y+=rh){
    let px=-rr(0,120);
    while(px<S){ const w=rr(90,170), v=rr(165,205);
      x.fillStyle=grey(v); x.fillRect(px+2,y+2,w-4,rh-4);
      x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(px+2,y+rh-12,w-4,10);
      x.fillStyle='rgba(255,255,255,.07)'; x.fillRect(px+2,y+2,w-4,6);
      px+=w; }
  }
  for(let i=0;i<6000;i++){ x.fillStyle=`rgba(40,30,20,${rr(.03,.12)})`; x.fillRect(rnd()*S,rnd()*S,rr(1,4),rr(1,3)); }
  return c;
}
function windowCanvases(){
  const [c,x]=canvas(128,256), [e,y]=canvas(128,256);
  x.fillStyle='#d6c9b2'; x.fillRect(0,0,128,256); y.fillStyle='#000'; y.fillRect(0,0,128,256);
  for(let i=0;i<2500;i++){ x.fillStyle=`rgba(80,60,40,${rr(.03,.1)})`; x.fillRect(rnd()*128,rnd()*256,2,2); }
  for(let r=18;r<240;r+=38) for(let k=12;k<120;k+=36){
    const lit=rnd()<.38;
    for(const [ctx,col] of [[x,lit?'#ffd590':'#2b2732'],[y,lit?'#ffcf86':'#000']]){
      ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(k,r+24); ctx.lineTo(k,r+7); ctx.arc(k+7,r+7,7,Math.PI,0); ctx.lineTo(k+14,r+24); ctx.closePath(); ctx.fill(); }
  }
  return [c,e];
}
function bannerCanvas(){
  const [c,x]=canvas(256,640);
  const shape=()=>{ x.beginPath(); x.moveTo(0,0); x.lineTo(256,0); x.lineTo(256,560); x.lineTo(128,636); x.lineTo(0,560); x.closePath(); };
  shape(); const g=x.createLinearGradient(0,0,0,640); g.addColorStop(0,'#26398a'); g.addColorStop(1,'#141f4c'); x.fillStyle=g; x.fill();
  x.save(); shape(); x.clip();
  x.strokeStyle='#d9b45a'; x.lineWidth=7;
  x.beginPath(); x.moveTo(18,30); x.lineTo(238,30); x.lineTo(238,548); x.lineTo(128,612); x.lineTo(18,548); x.closePath(); x.stroke();
  x.fillStyle='#d9b45a'; x.fillRect(0,0,256,22);
  const cx=128, cy=270;
  x.beginPath(); for(let k=0;k<16;k++){ const a=k*Math.PI/8-Math.PI/2, r=k%2?26:78; k?x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r); } x.closePath(); x.fill();
  x.lineWidth=4; x.beginPath(); x.arc(cx,cy,48,0,Math.PI*2); x.stroke();
  x.beginPath(); for(let k=0;k<8;k++){ const a=k*Math.PI/4-Math.PI/2, r=k%2?6:20; const px=cx+Math.cos(a)*r, py=440+Math.sin(a)*r; k?x.lineTo(px,py):x.moveTo(px,py);} x.closePath(); x.fill();
  x.restore();
  return c;
}
function dotCanvas(){ const [c,x]=canvas(64,64); const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.4,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,64,64); return c; }
function puffCanvas(){ const [c,x]=canvas(256,256); for(let i=0;i<14;i++){ const px=rr(70,186), py=rr(80,176), r=rr(40,80); const g=x.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,'rgba(255,255,255,.35)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,256,256);} return c; }

const cobbleTex = tex(cobbleCanvas(), [1,1]);
const ashlarC = ashlarCanvas();
const gateTex = tex(ashlarC, [.32,.32]);
const aqueTex = tex(ashlarC, [.12,.12]);
const [winC, winE] = windowCanvases();
const winTex = tex(winC), winEm = tex(winE);
const bannerTex = tex(bannerCanvas());
const dotTex = tex(dotCanvas());
const puffTex = tex(puffCanvas());

/* ---------- materials ---------- */
const rockMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.95, flatShading:true, side:THREE.DoubleSide });
const pathMat = new THREE.MeshStandardMaterial({ map:cobbleTex, bumpMap:cobbleTex, bumpScale:1.6, roughness:.92, color:0xe8ded0, side:THREE.DoubleSide });
const gateMat = new THREE.MeshStandardMaterial({ map:gateTex, bumpMap:gateTex, bumpScale:.4, roughness:.9, color:0xfff6ea });
const aqueMat = new THREE.MeshStandardMaterial({ map:aqueTex, roughness:.9, color:0xe6d8c2 });
const cityMat = new THREE.MeshStandardMaterial({ map:winTex, emissiveMap:winEm, emissive:0xffa64d, emissiveIntensity:2.2, roughness:.85 });
const roofMat = new THREE.MeshStandardMaterial({ color:0x34466e, roughness:.55, metalness:.15 });
const woodMat = new THREE.MeshStandardMaterial({ color:0x4a3527, roughness:.85 });
const ironMat = new THREE.MeshStandardMaterial({ color:0x2a2622, roughness:.5, metalness:.6 });
const glowMat = new THREE.MeshStandardMaterial({ color:0x000000, emissive:0xffa040, emissiveIntensity:2.2 });
const bannerMat = new THREE.MeshStandardMaterial({ map:bannerTex, alphaTest:.5, side:THREE.DoubleSide, roughness:.8 });
const foliageMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.9, flatShading:true });
const trunkMat = new THREE.MeshStandardMaterial({ color:0x4b3a2c, roughness:.95, flatShading:true });

/* ---------- helpers ---------- */
function colorRock(g, o={}){
  const p=g.attributes.position, n=g.attributes.normal, col=new Float32Array(p.count*3);
  const dark=new THREE.Color(o.dark??0x4e4c49), light=new THREE.Color(o.light??0xaaa69e), moss=new THREE.Color(o.mossCol??0x5a6a3a), snow=new THREE.Color(0xf4f1ee), c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const k=fbm(x*.13,y*.13,z*.13,3)*.9+.5;
    c.copy(dark).lerp(light, MU.clamp(k,0,1));
    const up=Math.abs(n.getY(i));
    const m=MU.smoothstep(up,.55,.85)*(o.moss??.85)*MU.clamp(fbm(x*.3+9,y*.3,z*.3,2)*1.5+.7,0,1);
    c.lerp(moss,m);
    if(o.snowY!==undefined){ const s=MU.smoothstep(y+fbm(x*.01,0,z*.01,3)*60, o.snowY, o.snowY+40)*MU.smoothstep(up,.35,.6); c.lerp(snow,s); }
    col.set([c.r,c.g,c.b], i*3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  return g;
}
function sheet(N, M, fn){
  const pos=new Float32Array((N+1)*(M+1)*3), uv=new Float32Array((N+1)*(M+1)*2), idx=[], v=new V3();
  for(let i=0;i<=N;i++) for(let j=0;j<=M;j++){ const k=i*(M+1)+j; fn(i/N, j/M, v); pos[k*3]=v.x; pos[k*3+1]=v.y; pos[k*3+2]=v.z; uv[k*2]=j/M; uv[k*2+1]=i/N; }
  for(let i=0;i<N;i++) for(let j=0;j<M;j++){ const a=i*(M+1)+j, b=a+M+1; idx.push(a,a+1,b, b,a+1,b+1); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.BufferAttribute(uv,2)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
function displaceRadial(g, f, amp, off){
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i), z=p.getZ(i), r=Math.hypot(x,z); if(r<.01) continue;
    const n=fbm((x+off.x)*f,(y+off.y)*f,(z+off.z)*f,4), k=(r+n*amp)/r; p.setX(i,x*k); p.setZ(i,z*k); }
  g.computeVertexNormals(); return g;
}
function boulderGeo(s){
  const g=new THREE.IcosahedronGeometry(1,2), p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const v=new V3().fromBufferAttribute(p,i); const n=fbm(v.x*1.3+s,v.y*1.3,v.z*1.3,3); v.multiplyScalar(1+n*.55); v.y*=.75; p.setXYZ(i,v.x,v.y,v.z); }
  g.computeVertexNormals(); return colorRock(g,{moss:.9});
}
const boulders=[0,7,13,21].map(boulderGeo);
function mesh(g, m, {cast=false, recv=false}={}){ const o=new THREE.Mesh(g,m); o.castShadow=cast; o.receiveShadow=recv; scene.add(o); return o; }

/* ---------- the cliff road ---------- */
const curve = new THREE.CatmullRomCurve3([[0,0,45],[.5,0,25],[1,.3,5],[-1,.8,-15],[-4,1.4,-35],[-3.5,2,-55],[0,2.6,-75],[2,3,-95],[1,3.2,-120]].map(a=>new V3(...a)), false, 'centripetal');

const windU = { value: 0 };
function windify(mat, amt){
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = windU;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
    #ifdef USE_INSTANCING
      vec3 ip=instanceMatrix[3].xyz;
    #else
      vec3 ip=vec3(0.);
    #endif
    float w=sin(uTime*1.7+ip.x*.6+ip.z*.4)*.5+sin(uTime*2.9+ip.z*1.3)*.25;
    transformed.x+=w*max(position.y,0.)*${amt.toFixed(3)}; transformed.z+=w*max(position.y,0.)*${(amt*.5).toFixed(3)};`);
  };
  return mat;
}

function treeGeos(){

const falls=[];
function fallMat(seedv){
  return new THREE.ShaderMaterial({ transparent:true, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{ uTime:clockU, uFog:{value:scene.fog.color}, uDen:{value:FOG_DEN}, uSeed:{value:seedv} },
    vertexShader:`varying vec2 vUv; varying vec3 vW; void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: GLSL_NOISE + `uniform float uTime,uDen,uSeed; uniform vec3 uFog; varying vec2 vUv; varying vec3 vW;
    void main(){ float y=1.-vUv.y;
      float s=vnoise(vec2(vUv.x*22.+uSeed, y*4.-uTime*1.4)), s2=vnoise(vec2(vUv.x*60.+uSeed*3., y*10.-uTime*2.6));
      float a=smoothstep(0.,.22,vUv.x)*smoothstep(1.,.78,vUv.x);
      a*=(.3+.7*smoothstep(.3,.85,s*.6+s2*.5)); a*=smoothstep(1.,.7,y)*smoothstep(0.,.015,y);
      vec3 c=mix(vec3(.72,.8,.86),vec3(1.),s2);
      float d=length(vW-cameraPosition); c=mix(c,uFog,1.-exp(-pow(d*uDen,2.)));
      gl_FragColor=vec4(c,a*.85);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }` });
}

function update(dt){
  time+=dt; clockU.value=time; windU.value=time;
  const auto=S.auto&&(modes.mode==='MainMenu'||modes.mode==='Exploration');
  const f=new V3(Math.sin(S.yaw),0,Math.cos(S.yaw)), rc=new V3(-f.z,0,f.x);
  const intent={x:0,z:0,sprint:false};
  if(auto){   // the title screen and the Auto-walk button drive the same motor as the player
    const {t,r}=fr(S.u), lean=MU.clamp((.7+Math.sin(time*.13)*.9-S.s)*.3,-.5,.5);
    intent.x=(t.x+r.x*lean)*.7; intent.z=(t.z+r.z*lean)*.7;
  } else {
    const fwd=input.held('MoveForward')-input.held('MoveBack'), side=input.held('MoveRight')-input.held('MoveLeft');
    intent.x=f.x*fwd+rc.x*side; intent.z=f.z*fwd+rc.z*side; intent.sprint=input.held('Sprint');
  }
  motor.step(dt,intent);
  ({u:S.u,s:S.s}=corridor.project(motor.x,motor.z));
  S.speed=motor.grounded?motor.speed:0;   // drives the walk cycle, so it stops in the air
  if(auto&&S.u>=corridor.uMax-.005&&!resetting){ resetting=true; fadeEl.style.opacity=1; setTimeout(()=>{ if(S.auto) spawn(START_U,START_S,AUTO_YAW); fadeEl.style.opacity=0; resetting=false; },1300); }
  const hp=new V3(motor.x,motor.y,motor.z);
  const k=MU.clamp(S.speed/1.55,0,1.6);
  S.phase+=S.speed*dt*4.3;
  hero.g.position.copy(hp); hero.g.rotation.y=motor.heading;
  if(hero.anim) stepHeroWalk(dt); else hero.g.position.y+=Math.abs(Math.sin(S.phase))*.045*k;
  hero.legs[0].rotation.x=Math.sin(S.phase)*.6*k; hero.legs[1].rotation.x=-Math.sin(S.phase)*.6*k;
  hero.arms[0].rotation.x=-Math.sin(S.phase)*.45*k; hero.arms[1].rotation.x=Math.sin(S.phase)*.45*k;
  { const a=hero.scarf.geometry.attributes.position, b=hero.scarf.userData.base;
    for(let i=0;i<a.count;i++){ const y=b[i*3+1]; a.setZ(i,b[i*3+2]+y*(.25+.45*k)*.6+Math.sin(time*7+y*6)*.05*(-y)); } a.needsUpdate=true; }

  const hd=new V3(Math.sin(motor.heading),0,Math.cos(motor.heading));
  const catT=hp.clone().addScaledVector(hd,-.4).add(new V3(hd.z,0,-hd.x).multiplyScalar(1.05));
  { const {x,z}=world.slide(catT.x,catT.z,motor.y,.2,motor.cfg.step); catT.set(x,world.groundAt(x,z,cat.position.y,motor.cfg.step),z); }
  const cd=catT.clone().sub(cat.position); cd.y=0;

  if(cd.lengthSq()>.0004) cat.rotation.y=lerpAngle(cat.rotation.y,Math.atan2(cd.x,cd.z),1-Math.exp(-dt*6));
  // camera
  if(auto&&!S.drag){ S.yaw=lerpAngle(S.yaw,roadYaw(S.u)+AUTO_YAW,1-Math.exp(-dt*.6)); S.pitch=lerp(S.pitch,.02,1-Math.exp(-dt*.6)); }
  else if(!S.drag&&time-S.dragEnd>1.2&&motor.speed>.5){   // trail behind the hero, but never swing round when they walk toward the camera

  }

  else { camPivot.x=lerp(camPivot.x,hp.x,1-Math.exp(-dt*9)); camPivot.z=lerp(camPivot.z,hp.z,1-Math.exp(-dt*9)); camPivot.y=lerp(camPivot.y,hp.y,1-Math.exp(-dt*5)); }

  sun.position.copy(hp).addScaledVector(SUN,150); sun.target.position.copy(hp); sun.target.updateMatrixWorld();
  // banners
  for(const b of banners){ const a=b.geometry.attributes.position, base=b.userData.base;
    for(let i=0;i<a.count;i++){ const y=base[i*3+1], x=base[i*3]; a.setZ(i,base[i*3+2]+Math.sin(time*1.9+y*1.7+x*1.2+b.userData.ph)*.09*(-y)+(-y)*(-y)*.02); } a.needsUpdate=true; b.geometry.computeVertexNormals(); }
  for(const l of lanterns){ l.lan.rotation.z=Math.sin(time*1.4+l.ph)*.04; l.lan.getWorldPosition(l.w); l.w.y+=l.drop; l.d=l.w.distanceToSquared(hp); }
  lanterns.sort((a,b)=>a.d-b.d);
  lampLights.forEach((L,i)=>{ const l=lanterns[i]; L.position.copy(l.w); L.intensity=7+Math.sin(time*13+l.ph)*.6+Math.sin(time*7.3+l.ph*2)*.5; });

    for(const [ax,lim] of [[0,20],[2,20]]){ const d=mp[i*3+ax]-(ax?hp.z:hp.x); if(d>lim) mp[i*3+ax]-=2*lim; else if(d<-lim) mp[i*3+ax]+=2*lim; }

}

{ const p0=curve.getPointAt(S.u); for(let i=0;i<MOTES;i++){ mp[i*3]+=p0.x; mp[i*3+1]+=p0.y; mp[i*3+2]+=p0.z; } }

/* ---------- Blender assets (./assets/*.glb, built by ./blender/*.py) ----------
   Everything above is the procedural world. Each GLB replaces its procedural
   counterpart when it arrives; if one fails, that part simply stays procedural. */
const prepare=(root,cast=true)=>{ root.traverse(o=>{ if(o.isMesh){ o.castShadow=cast; o.receiveShadow=true; } }); return root; };
// World-space grain and pitting. Vertex colours alone can't carry detail finer than the mesh.
function grain(mat, amt=1){
  mat.onBeforeCompile=sh=>{
    sh.vertexShader='varying vec3 vGrainW;\n'+sh.vertexShader.replace('#include <project_vertex>',`#include <project_vertex>
    #ifdef USE_INSTANCING
      vGrainW=(modelMatrix*instanceMatrix*vec4(transformed,1.)).xyz;
    #else
      vGrainW=(modelMatrix*vec4(transformed,1.)).xyz;
    #endif`);
    sh.fragmentShader='varying vec3 vGrainW;\n'+GLSL_NOISE+sh.fragmentShader
      .replace('#include <color_fragment>',`#include <color_fragment>
      vec2 gp=vGrainW.xz+vGrainW.y*vec2(.73,-.61);
      float gBig=fbm2(gp*.55), gFine=fbm2(gp*3.1), gPit=smoothstep(.56,.72,vnoise(gp*9.));
      float gVal=gBig*.55+gFine*.45;
      diffuseColor.rgb*=mix(1.,(.62+gVal*.9)*(1.-gPit*.3),${amt.toFixed(2)});`)
      .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
      { float gh=gVal*1.6-gPit*.5; vec3 dpx=dFdx(-vViewPosition), dpy=dFdy(-vViewPosition);
        float sc=${(amt*.9).toFixed(2)}/max(length(dpx)+length(dpy),.002)*.02;
        normal=normalize(normal-sc*(dFdx(gh)*normalize(dpx)+dFdy(gh)*normalize(dpy))); }`);
  };
  mat.customProgramCacheKey=()=>'grain'+amt;
  mat.needsUpdate=true;
  return mat;
}

// road.glb is a straight strip: x = lateral, -z = distance, y = height above the road surface.
// Bending it here keeps it on the curve if the curve changes. The old road sheet becomes the bed the joints show.
function useRoad(gltf){
  const m=gltf.scene.getObjectByName('road_stones'), g=m.geometry, p=g.attributes.position;
  g.computeBoundingBox();
  const {min,max}=g.boundingBox, v=new V3();
  for(let i=0;i<p.count;i++){
    const s=p.getX(i), {p:c,r}=frLerp((max.z-p.getZ(i))/(max.z-min.z));
    v.copy(c).addScaledVector(r,s); v.y+=crown(Math.min(Math.abs(s),HALF))+p.getY(i);
    p.setXYZ(i,v.x,v.y,v.z);
  }
  g.computeVertexNormals(); g.computeBoundingBox(); g.computeBoundingSphere();
  grain(m.material,.7);
  m.receiveShadow=true; scene.add(m);
  pathMat.map=pathMat.bumpMap=null; pathMat.color.set(0x2a231b); pathMat.needsUpdate=true;
  pathMesh.position.y=-.09;
}
// Leaf normals are baked to point out of each clump, so back faces must keep them instead of flipping.
function leafMaterial(base, amt){
  const mat=windify(base.clone(), amt), wind=mat.onBeforeCompile;
  mat.side=THREE.DoubleSide;
  mat.onBeforeCompile=sh=>{ wind(sh); sh.fragmentShader=sh.fragmentShader.replace('#include <normal_fragment_begin>',
    THREE.ShaderChunk.normal_fragment_begin.replace('gl_FrontFacing ? 1.0 : - 1.0','1.0')); };
  mat.customProgramCacheKey=()=>'leaf'+amt;
  return mat;
}
function useFoliage(gltf){
  // Its own sequence: assets load in any order, so sharing rnd() would make the rock layout vary.
  let fs=4177; const f=()=>{ fs=fs+0x6D2B79F5|0; let t=Math.imul(fs^fs>>>15,1|fs); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const between=(a,b)=>a+(b-a)*f(), node=n=>gltf.scene.getObjectByName(n), base=node('tree_0_leaf').material;
  const treeLeaf=leafMaterial(base,.012), bushLeaf=leafMaterial(base,.05);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), tint=new THREE.Color();
  const plant=(name,list,leaf,cast)=>{
    if(!list.length) return;
    const wood=node(name+'_wood'), parts=[[node(name+'_leaf'),leaf]]; if(wood) parts.push([wood,wood.material]);
    for(const [v,mat] of parts){
      const im=new THREE.InstancedMesh(v.geometry,mat,list.length);
      list.forEach((x,i)=>{ im.setMatrixAt(i,x); if(mat===leaf) im.setColorAt(i,tint.setRGB(between(.8,1.12),between(.86,1.1),between(.75,1))); });
      im.castShadow=cast; im.receiveShadow=true; im.frustumCulled=false; scene.add(im);
    }
  };
  const matrices=im=>Array.from({length:im.count},(_,i)=>{ const x=new THREE.Matrix4(); im.getMatrixAt(i,x); return x; });
  const at=(pos,s)=>m.clone().compose(pos,q.setFromAxisAngle(UP,f()*6.3),new V3(s*between(.9,1.15),s*between(.85,1.2),s*between(.9,1.15)));
  // replace the blob trees in place
  const near=matrices(forests.near[0]), tops=matrices(forests.tops[0]);
  [...forests.near,...forests.tops].forEach(o=>{ o.visible=false; });
  const tree=[near.filter((_,i)=>i%2),near.filter((_,i)=>!(i%2))];
  // small trees on the lip; only a few, so the view to the city stays open
  [.35,.66,.76].forEach((u,i)=>tree[i%2].push(at(place(u,-(HALF+1.05),-.4),between(.46,.56))));
  plant('tree_0',tree[0],treeLeaf,true); plant('tree_1',tree[1],treeLeaf,true); plant('tree_far',tops,treeLeaf,false);
  // verge bushes in patches, kept clear of the lamps and the arch
  const verge=(lo,hi,s0,s1,dy,big,cast)=>{ const kinds={bush_0:[],bush_1:[],bloom_0:[],bloom_1:[],bloom_2:[]};
    for(let d=2;d<PATH_LEN;d+=between(lo,hi)){
    const u=d/PATH_LEN, s=between(s0,s1), pos=place(u,s,dy);
    if(noise3(d*.1,s>0?7:3,0)<-.16 || Math.abs(u-.62)*PATH_LEN<2.4) continue;
    if(lamps.some(L=>L.g.position.distanceTo(pos)<1.5)) continue;
    const r=f(), kind=r<.42?'bush_0':r<.74?'bush_1':r<.84?'bloom_0':r<.93?'bloom_1':'bloom_2';
    kinds[kind].push(at(pos,between(.75,big)));
    }
    for(const [name,list] of Object.entries(kinds)) plant(name,list,bushLeaf,cast);
  };
  // the sun is on the left, so only that side's shadows reach the road
  verge(.75,1.7,-(HALF+1.15),-(HALF+.4),-.28,1.35,true);
  verge(1.5,3.4,HALF+.7,HALF+2,-.2,1.25,false);
  // grass: new tufts on the old spots, then golden drifts along both verges
  const blades=leafMaterial(base,.28), tufts=[[],[]]; blades.roughness=1;
  matrices(forests.grass).forEach((x,i)=>tufts[i%2].push(x));
  forests.grass.visible=false;
  const drift=(n,s0,s1,dy)=>{ for(let i=0;i<n;i++){
    const d=f()*PATH_LEN, s=between(s0,s1);
    if(noise3(d*.07,s>0?11:5,0)>-.1) tufts[f()<.7?0:1].push(at(place(d/PATH_LEN,s,dy),between(.8,1.5)));
  } };
  drift(1100,-(HALF+.9),-(HALF-.1),-.1);
  drift(600,HALF-.1,HALF+1.8,-.12);
  plant('grass_0',tufts[0],blades,false); plant('grass_1',tufts[1],blades,false);
}
function useArchway(gltf){
  archway.proc.forEach(o=>archway.g.remove(o));
  gltf.scene.traverse(o=>{ if(o.isMesh && o.material.name==='stone') grain(o.material,.8); });
  archway.g.add(prepare(gltf.scene));
  archway.banners.forEach((b,i)=>{ b.position.set(i?3.6:-3.6, 9.0, 1.17); b.scale.setScalar(1.2); });
}
function useLamp(gltf){
  gltf.scene.traverse(o=>{ if(o.isMesh && o.material.name==='glow') o.material=glowMat; });
  for(const L of lamps){
    L.proc.forEach(o=>L.g.remove(o));
    const m=prepare(gltf.scene.clone(true)); L.g.add(m);
    L.entry.lan=m.getObjectByName('Lantern'); L.entry.drop=-.5;
    L.banner.position.set(-.72,4.76,.12); L.banner.scale.setScalar(1);
  }
}
function useRocks(gltf){
  const node=n=>gltf.scene.getObjectByName(n), mat=grain(node('rock_0').material,.28);
  const groups=new Map(), m=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(0,0,0,'YXZ');
  const ivyLists=[[],[],[],[]];
  const put=(type,pos,s,yaw,cast,sv=[1,1,1],ivy=false,lo=false)=>{
    const k=type+(cast?'c':'')+(lo?'l':''); if(!groups.has(k)) groups.set(k,{type,cast,lo,list:[]});
    q.setFromEuler(e.set(rr(-.06,.06),yaw,rr(-.06,.06)));
    const x=m.clone().compose(pos,q,new V3(s*sv[0],s*sv[1],s*sv[2]));
    groups.get(k).list.push(x);
    if(ivy) ivyLists[type].push(x);
  };
  const along=t=>Math.atan2(-t.z,t.x)+(rnd()<.5?Math.PI:0);
  // cliff face: rows of slabs climbing away from the road; long side runs with the road
  for(const [y,step,s0,s1,cast,ivyP] of [[-1.6,6.4,.85,1.25,true,.7],[3,6.8,.95,1.3,false,.5],[8,8.5,1.2,1.7,false,.6],[20,11,1.8,2.5,false,.3],[34,13,2.4,3.2,false,0]]){
    for(let d=rr(0,step); d<PATH_LEN; d+=step*rr(.8,1.15)){
      const u=d/PATH_LEN, {t}=fr(u), s=rr(s0,s1), type=Math.floor(rnd()*4);
      const pos=place(u, 3.8+2.9*s+Math.max(y,0)*.2+rr(0,.5), y), yaw=along(t)+rr(-.25,.25);
      put(type,pos,s,yaw,cast,[1,1,1],rnd()<ivyP,y>=20);
    }
  }
  // the procedural pillars keep their shafts but get sculpted crowns
  for(const [x,z,ty,r] of pillars) for(let i=0;i<3;i++){
    const a=rnd()*6, d=i?r*.5:0;
    put(4+i%2, new V3(x+Math.cos(a)*d,ty-r*.2,z+Math.sin(a)*d), r*(i?.2:.24), rnd()*6, false, [1,1,1], false, true);
  }
  // ledges under the left lip
  for(let d=rr(0,8); d<PATH_LEN; d+=rr(7,13)){
    const u=d/PATH_LEN, {t}=fr(u), s=rr(.8,1.4);
    put(4+Math.floor(rnd()*2), place(u,-(HALF+1+3*s),-(3.4*s+.45)), s, along(t)+rr(-.3,.3), true);
  }
  // roadside boulders take over the procedural ones' spots
  boulderMeshes.forEach((b,i)=>{ b.visible=false; put(6+i%2, b.position.clone().setY(b.position.y-.3*b.scale.y), .62*b.scale.y, b.rotation.y, true, [b.scale.x/b.scale.y,1,b.scale.z/b.scale.y]); });
  for(const {type,cast,lo,list} of groups.values()){
    const im=new THREE.InstancedMesh(node(`rock_${type}${lo?'_lo':''}`).geometry, mat, list.length);
    list.forEach((x,i)=>im.setMatrixAt(i,x));
    im.castShadow=cast; im.receiveShadow=true; im.frustumCulled=false; scene.add(im);
  }
  // ivy was grown on each rock in Blender, so it shares that rock's instance matrices
  ivyLists.forEach((l,k)=>{ if(!l.length) return; const v=node('ivy_'+k), im=new THREE.InstancedMesh(v.geometry,v.material,l.length); l.forEach((x,i)=>im.setMatrixAt(i,x)); im.frustumCulled=false; im.receiveShadow=true; scene.add(im); });
}
function useCity(gltf){
  const {meshes,orb,halo,toward}=cityProc;
  meshes.forEach(o=>{ o.visible=false; });
  const city=gltf.scene;
  city.traverse(o=>{ if(o.isMesh && o.material.name==='city_win') o.material=new THREE.MeshBasicMaterial({ vertexColors:true, color:new THREE.Color(1.7,1.35,.95) }); });
  city.position.copy(CITY); city.rotation.y=Math.atan2(toward.x,toward.z); scene.add(city);
  orb.position.copy(CITY).add(new V3(0,152,0).addScaledVector(toward,-10)); halo.position.copy(orb.position);

// Tripo model: 1 unit tall, feet at the origin, facing +X. The hero group faces +Z and is scaled .86.
const HERO_SCALE=2.4;
const HERO_CLIP_SPEED=.658*HERO_SCALE*.86;   // ground speed at 1x, from a planted foot in the walk clip
const HERO_PASSING=[.053,.66,1.229,1.82];    // clip times when the feet pass; there's no idle clip, so he stops on one
function useHero(gltf){
  const m=prepare(gltf.scene), mixer=new THREE.AnimationMixer(m), walk=mixer.clipAction(gltf.animations[0]);
  m.traverse(o=>{ if(o.isMesh){ o.material.side=THREE.DoubleSide; o.frustumCulled=false; } }); // thin open coat; bounds are the bind pose
  m.scale.setScalar(HERO_SCALE); m.rotation.y=-Math.PI/2;
  walk.play(); walk.time=HERO_PASSING[0];
  hero.g.children.forEach(o=>{ o.visible=false; });
  hero.g.add(m);
  hero.anim={mixer,walk};
}
// Tripo model: centred on the origin, facing +X, unrigged, so it waddles instead of walking.
// The sheet's .40 m beside a 1.78 m hero would be .46 units; Edda is 1.5x that to read from the follow camera.
// The cat group faces +Z and is scaled 1.15.
function useEdda(gltf){
  const m=prepare(gltf.scene), box=new THREE.Box3().setFromObject(m), s=.69/1.15/(box.max.y-box.min.y), waddle=new THREE.Group();
  m.traverse(o=>{ if(o.isMesh) o.material.side=THREE.DoubleSide; }); // the scarf tails are thin, open shell
  m.scale.setScalar(s); m.position.y=-box.min.y*s; m.rotation.y=-Math.PI/2;
  waddle.add(m);
  cat.children.forEach(o=>{ o.visible=false; });
  cat.add(waddle); cat.userData.waddle=waddle;
}
function stepHeroWalk(dt){
  const {mixer,walk}=hero.anim, rate=Math.abs(S.speed)/HERO_CLIP_SPEED;
  if(rate>.1){ mixer.update(dt*rate); return; }
  const rest=HERO_PASSING.reduce((a,b)=>Math.abs(b-walk.time)<Math.abs(a-walk.time)?b:a);
  walk.time+=(rest-walk.time)*(1-Math.exp(-dt*6)); mixer.update(0);
}

const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05);
  if(modes.mode!=='Paused') update(dt);   // the world freezes but keeps rendering behind the menu
  composer.render();
  requestAnimationFrame(loop);
}
const assetState=window.__lumina={ renderer, camera, shell, S, motor, world, corridor, colliders };
// also on <html data-road="glb">, so tests/smoke.ps1 can read each asset's result from a headless DOM dump
const markAsset=(name,state)=>{ assetState[name]=state; document.documentElement.dataset[name]=state; };
// published artifacts can't serve .glb, so they use the JSON copies from blender/glb_to_json.py
// They're repacked into a GLB here so the loader never has to fetch a data: URI, which a strict page policy can block.
async function jsonToGlb(url){
  const res=await fetch(url); if(!res.ok) throw new Error(`${url}: ${res.status}`);
  const g=await res.json(), bin=Uint8Array.from(atob(g.buffers[0].uri.split(',')[1]),c=>c.charCodeAt(0));
  delete g.buffers[0].uri;
  const raw=new TextEncoder().encode(JSON.stringify(g)), jl=Math.ceil(raw.length/4)*4, bl=Math.ceil(bin.length/4)*4;
  const out=new Uint8Array(28+jl+bl), v=new DataView(out.buffer);
  v.setUint32(0,0x46546C67,true); v.setUint32(4,2,true); v.setUint32(8,out.length,true);
  v.setUint32(12,jl,true); v.setUint32(16,0x4E4F534A,true); out.fill(32,20,20+jl); out.set(raw,20);
  v.setUint32(20+jl,bl,true); v.setUint32(24+jl,0x004E4942,true); out.set(bin,28+jl);
  return out.buffer;
}
const loadAsset=name=>{ const l=new GLTFLoader(), web=()=>jsonToGlb(`assets/web/${name}.gltf.json`).then(b=>l.parseAsync(b,''));
  return new URLSearchParams(location.search).has('webjson') ? web() : l.loadAsync(`assets/${name}.glb`).catch(web); };
const assetsDone=new URLSearchParams(location.search).has('noglb') ? Promise.resolve() : Promise.allSettled(
  [['road',useRoad],['archway',useArchway],['lamp',useLamp],['rocks',useRocks],['city',useCity],['hero',useHero],['edda',useEdda],['foliage',useFoliage]].map(([name,use])=>
    loadAsset(name).then(use).then(()=>markAsset(name,'glb'))
      .catch(err=>{ markAsset(name,'procedural'); console.warn(`assets/${name}.glb not used, keeping the procedural version:`, err); })));
// don't hold the opening fade for a slow connection; late assets still swap in
Promise.race([assetsDone, new Promise(r=>setTimeout(r,9000))]).then(()=>{
  const q=new URLSearchParams(location.search);
  if(q.has('shot')) fadeEl.style.transition='none'; // headless captures
  shell.start({skipTitle:q.has('shot')||q.has('u')});
  update(0.016); composer.render();
  requestAnimationFrame(()=>{ fadeEl.textContent=''; fadeEl.style.opacity=0; loop(); });
});
